<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Human-first execution · 交互对比</title>
<style>
:root{color-scheme:dark;--bg:#0e1116;--panel:#171c24;--line:#2a3442;--text:#eef3f8;--muted:#9eabb9;--accent:#77d4b4;--accent2:#86a9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#182234,#0e1116 55%);font:16px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text)}main{max-width:1100px;margin:auto;padding:36px 20px 64px}h1{margin:0 0 8px;font-size:clamp(28px,5vw,48px)}h2{margin-top:34px}.lead,.note{color:var(--muted)}.note{font-size:13px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:24px 0}.switch{display:flex;gap:8px;align-items:center;color:var(--accent)}select,button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 12px}button{background:var(--accent2);color:#08111f;font-weight:700;cursor:pointer}.card{background:rgba(23,28,36,.9);border:1px solid var(--line);border-radius:12px;padding:16px}.metric{display:grid;grid-template-columns:1fr auto;gap:7px 12px;margin:16px 0}.metric small{color:var(--muted)}.metric strong{grid-column:2;grid-row:1 / span 2;color:var(--accent);font-size:20px}.bar{height:10px;background:#29313d;border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:999px}.diff{display:grid;grid-template-columns:1fr 1fr;gap:12px}.diff div{padding:14px;border-radius:10px;min-height:110px}.before{background:#2b2025;border:1px solid #55343d}.after{background:#17332f;border:1px solid #2b6659}.tag{display:inline-block;padding:3px 8px;border-radius:999px;background:#263148;color:#b9c9ff;font-size:12px}@media(max-width:650px){.diff{grid-template-columns:1fr}}
</style></head>
<body><main>
<h1>同一个任务，交流成本差多少？</h1>
<p class="lead">这是协议目标的可交互说明。分数是 1–5 的示例 rubric，不是模型基准。</p>
<div class="controls"><label class="switch"><input id="combined" type="checkbox" checked> 启用组合模式</label><label>场景 <select id="scenario"></select></label><button id="copy">复制当前对比</button></div>
<section class="card"><h2>目标行为</h2><div id="metrics"></div><p class="note">“模板/复述负担”越低越好，其余指标越高越好。</p></section>
<section><h2 id="scenarioTitle"></h2><div class="diff"><div class="before"><span class="tag">常见摩擦示例</span><p id="before"></p></div><div class="after"><span class="tag">协议目标示例</span><p id="after"></p></div></div><p class="note" id="why"></p></section>
</main>
<script>
const data={"modes":{"baseline":"默认 GPT/Codex 交流方式（示例）","combined":"human-first-execution 组合模式"},"dimensions":[{"label":"首句给结果","unit":"越高越好","baseline":2,"combined":5},{"label":"普通决定由模型承担","unit":"越高越好","baseline":1,"combined":5},{"label":"证据可见","unit":"越高越好","baseline":2,"combined":4},{"label":"纠正后继续推进","unit":"越高越好","baseline":2,"combined":5},{"label":"模板/复述负担","unit":"越低越好","baseline":4,"combined":1},{"label":"外部效果审批边界","unit":"越高越好","baseline":2,"combined":5}],"scenarios":[{"id":"defaults","title":"缺少低风险细节","before":"仓库名、文件名、测试框架都没给。要不要先确认这三项？","after":"我先用 src/cli.py、pytest 和 pyproject.toml 做最小闭环，因为这些选择可逆；跑通后再调整。","why":"把低风险选择变成工作假设，继续推进。"},{"id":"bug","title":"报错与修复","before":"我可以先分析原因，然后根据你的意见决定是否修复。","after":"根因是 X。已改 Y，定向测试通过；剩余风险是 Z。","why":"把计划换成可验证的工作切片。"},{"id":"publish","title":"准备发布","before":"已经准备好了，我现在发布。","after":"材料和检查已完成；GitHub push / B 站上传是外部发布动作，停在最终确认点。","why":"果断不等于越权。"}]};
const $=id=>document.getElementById(id);for(const s of data.scenarios){const o=document.createElement('option');o.value=s.id;o.textContent=s.title;$('scenario').append(o)}function render(){const mode=$('combined').checked?'combined':'baseline';$('metrics').innerHTML=data.dimensions.map(d=>`<div class="metric"><span>${d.label}</span><strong>${d[mode]}/5</strong><small>${d.unit}</small><div class="bar"><div class="fill" style="width:${d[mode]*20}%"></div></div></div>`).join('');const s=data.scenarios.find(x=>x.id===$('scenario').value)||data.scenarios[0];$('scenarioTitle').textContent=s.title+' · '+data.modes[mode];$('before').textContent=s.before;$('after').textContent=s.after;$('why').textContent='为什么：'+s.why}$('combined').onchange=render;$('scenario').onchange=render;$('copy').onclick=()=>{const s=data.scenarios.find(x=>x.id===$('scenario').value)||data.scenarios[0];navigator.clipboard?.writeText(s.before+'\n\n→\n\n'+s.after);$('copy').textContent='已复制';setTimeout(()=>$('copy').textContent='复制当前对比',1200)};$('scenario').value=data.scenarios[0].id;render();
</script></body></html>
